[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpwatchman"
version = "0.16.0"
description = "Independent security and quality audit for Model Context Protocol servers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kVadrum" }]
keywords = ["mcp", "model-context-protocol", "security", "audit", "static-analysis", "supply-chain"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3.12",
]
# Core deps = the CLI + API client only, so `pip install mcpwatchman` stays light.
# Scanner/worker and API deps live in optional groups below.
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]
workers = [
  # DB: ADR-004 (Postgres + SQLAlchemy 2.x + Alembic)
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  # Static analysis: ADR-002 (semgrep core; osv-scanner is an external Go binary)
  "semgrep>=1.75",
  "detect-secrets>=1.5",
  # Queue: PgQueuer, RATIFIED 2026-09-16 (operator accepted the /rr; ADR-001).
  # Postgres-native, so Redis leaves the topology entirely and rate-limit
  # counters move to a Postgres table. RQ was struck on a spec-level defect
  # (`02` §2.1's three priority lanes force RQ's multi-queue path, where a
  # dequeued job id exists in no Redis list); Procrastinate is the fallback.
  # Bus factor is 1 — the accepted risk and what flips it are in ADR-001.
  "pgqueuer[psycopg]>=1.4",
  # The DRIVER IS NOT TRANSITIVE — pgqueuer declares asyncpg and psycopg only
  # as extras, so a bare `pgqueuer` installs a queue that cannot connect.
  # psycopg3 (not asyncpg) because SQLAlchemy reaches it via
  # `postgresql+psycopg://`, so one driver serves both the queue and the ORM.
  # `[binary]` ships libpq: docker/Dockerfile is python:3.12-slim + git only,
  # where a source psycopg installs fine and then fails at runtime.
  "psycopg[binary]>=3.2",
]
dev = [
  # Pinned to a minor: ruff gates CI, and new lint rules ship in 0.x releases.
  "ruff~=0.16.7",
  "mypy>=1.10",
  "pytest>=8.2",
]

[project.urls]
Homepage = "https://mcpwatchman.com"
Repository = "https://github.com/kVadrum/mcpwatchman"

[project.scripts]
mcpwatchman = "mcpwatchman.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpwatchman"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
# The semgrep fixtures are deliberately-vulnerable SAMPLE code, not project
# source: `tests/fixtures/semgrep/vulnerable/` exists to be flagged, and its
# safe twin is written in the idiom of the servers we scan rather than ours.
# Linting them means annotating ~25 findings as intentional, which is noise
# over a file whose whole job is to carry them. (ruff's own bandit rules agree
# with the ruleset on every one, which is quiet corroboration worth noting.)
extend-exclude = ["tests/fixtures/"]

[tool.ruff.lint]
# S = flake8-bandit. A static-analysis project that does not run security lint
# on its own source is a bad look the first time anyone checks.
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 bans `assert`, which is the entire vocabulary of a pytest suite.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
# Put the repo root on sys.path so `tests` is importable as a package and test
# modules can share helpers.
#
# The real reason this line exists is that WITHOUT it the suite's result depends
# on how it was invoked: `python -m pytest` puts the cwd on sys.path and passes,
# bare `pytest` does not and fails at collection. CI runs the bare form. That is
# a local green that cannot predict CI, which is worse than a red — it is a
# verification that reports success without having tested what CI tests.
# Pinning it here makes the two invocations identical.
pythonpath = ["."]
