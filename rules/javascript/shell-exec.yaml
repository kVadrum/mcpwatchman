rules:
  - id: mcp-js-shell-exec-nonliteral
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A shell is spawned on a value that is not a string literal. child_process
      .exec and execSync run their argument through /bin/sh, so any
      caller-supplied component is shell syntax, not data.
    metadata:
      mcp_pattern: value-to-shell
      cwe: "CWE-78"
    # ⚠ THE RECEIVER MUST BE child_process (ruleset 0.1.1). This read
    # `$CP.exec($CMD, ...)` with `$CP` unconstrained, so `re.exec(line)` — the
    # ordinary RegExp method — was published as a critical "a shell is spawned"
    # finding: ~60% of this rule's shown findings, on 52 servers, found by the
    # gold-set audits. Two halves, because neither reaches every binding form:
    # semgrep's own import resolution (the qualified patterns) follows a
    # require-bound name and a named import, alias included; the pattern-inside
    # branches catch destructured requires, namespace and default imports, an
    # inline require, and dynamic `import()` — awaited or `.then`-bound — which
    # the free `$CP` had matched and the first cut of 0.1.1 dropped (a critical
    # false negative per form). The binding block is the same in all three
    # shell rules (this file and mcp-specific.yaml): change them together.
    # tests/fixtures/semgrep/receivers pins both directions.
    patterns:
      - pattern-either:
          - pattern: "child_process.exec($CMD, ...)"
          - pattern: "child_process.execSync($CMD, ...)"
          - pattern: "child_process.spawn($CMD, ..., {shell: true})"
          - pattern: "child_process.spawnSync($CMD, ..., {shell: true})"
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $CP = require("$M");
                      ...
                  - pattern-inside: |
                      import $CP from "$M";
                      ...
                  - pattern-inside: |
                      import * as $CP from "$M";
                      ...
                  - pattern-inside: |
                      $CP = await import("$M");
                      ...
                  - pattern-inside: import("$M").then(($CP) => $BODY)
                  - pattern-inside: import("$M").then(function ($CP) { ... })
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(node:)?child_process$
              - pattern-either:
                  - pattern: "$CP.exec($CMD, ...)"
                  - pattern: "$CP.execSync($CMD, ...)"
                  - pattern: "$CP.spawn($CMD, ..., {shell: true})"
                  - pattern: "$CP.spawnSync($CMD, ..., {shell: true})"
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      { ..., $FN, ... } = require("$M");
                      ...
                  - pattern-inside: |
                      import { ..., $FN, ... } from "$M";
                      ...
                  - pattern-inside: |
                      { ..., $FN, ... } = await import("$M");
                      ...
                  - pattern-inside: import("$M").then(({ ..., $FN, ... }) => $BODY)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(node:)?child_process$
              - metavariable-regex:
                  metavariable: $FN
                  regex: ^(exec|execSync)$
              - pattern: "$FN($CMD, ...)"
          # Inline receivers: a require or an awaited import used in place.
          - patterns:
              - pattern-either:
                  - pattern: "require(\"$M\").exec($CMD, ...)"
                  - pattern: "require(\"$M\").execSync($CMD, ...)"
                  - pattern: "require(\"$M\").spawn($CMD, ..., {shell: true})"
                  - pattern: "require(\"$M\").spawnSync($CMD, ..., {shell: true})"
                  - pattern: "(await import(\"$M\")).exec($CMD, ...)"
                  - pattern: "(await import(\"$M\")).execSync($CMD, ...)"
                  - pattern: "(await import(\"$M\")).spawn($CMD, ..., {shell: true})"
                  - pattern: "(await import(\"$M\")).spawnSync($CMD, ..., {shell: true})"
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(node:)?child_process$
      - pattern-not: $CP.$F("...", ...)
      - pattern-not: $F("...", ...)

  - id: mcp-js-shell-exec-template-literal
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A shell command is built from a template literal with interpolation.
      Quoting inside a template does not escape shell metacharacters.
    metadata:
      mcp_pattern: value-to-shell
      cwe: "CWE-78"
    # ⚠ THE RECEIVER MUST BE child_process (ruleset 0.1.1). This read
    # `$CP.exec($CMD, ...)` with `$CP` unconstrained, so `re.exec(line)` — the
    # ordinary RegExp method — was published as a critical "a shell is spawned"
    # finding: the sibling rule's defect, and `db.exec(`SELECT ${x}`)` is this one's, found by the
    # gold-set audits. Two halves, because neither reaches every binding form:
    # semgrep's own import resolution (the qualified patterns) follows a
    # require-bound name and a named import, alias included; the pattern-inside
    # branches catch destructured requires, namespace and default imports, an
    # inline require, and dynamic `import()` — the same binding block as the
    # rule above, changed with it. tests/fixtures/semgrep/receivers pins both
    # directions.
    patterns:
      - pattern-either:
          - pattern: "child_process.exec(`...${$X}...`, ...)"
          - pattern: "child_process.execSync(`...${$X}...`, ...)"
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $CP = require("$M");
                      ...
                  - pattern-inside: |
                      import $CP from "$M";
                      ...
                  - pattern-inside: |
                      import * as $CP from "$M";
                      ...
                  - pattern-inside: |
                      $CP = await import("$M");
                      ...
                  - pattern-inside: import("$M").then(($CP) => $BODY)
                  - pattern-inside: import("$M").then(function ($CP) { ... })
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(node:)?child_process$
              - pattern-either:
                  - pattern: "$CP.exec(`...${$X}...`, ...)"
                  - pattern: "$CP.execSync(`...${$X}...`, ...)"
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      { ..., $FN, ... } = require("$M");
                      ...
                  - pattern-inside: |
                      import { ..., $FN, ... } from "$M";
                      ...
                  - pattern-inside: |
                      { ..., $FN, ... } = await import("$M");
                      ...
                  - pattern-inside: import("$M").then(({ ..., $FN, ... }) => $BODY)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(node:)?child_process$
              - metavariable-regex:
                  metavariable: $FN
                  regex: ^(exec|execSync)$
              - pattern: "$FN(`...${$X}...`, ...)"
          - patterns:
              - pattern-either:
                  - pattern: "require(\"$M\").exec(`...${$X}...`, ...)"
                  - pattern: "require(\"$M\").execSync(`...${$X}...`, ...)"
                  - pattern: "(await import(\"$M\")).exec(`...${$X}...`, ...)"
                  - pattern: "(await import(\"$M\")).execSync(`...${$X}...`, ...)"
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(node:)?child_process$
