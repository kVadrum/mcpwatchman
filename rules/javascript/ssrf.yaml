rules:
  - id: mcp-js-ssrf-nonliteral-url
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      An outbound request is made to a URL that is not a literal. If any part is
      caller-supplied the server can be aimed at internal hosts it can reach and
      the caller cannot.
    metadata:
      mcp_pattern: value-to-fetch
      cwe: "CWE-918"
    # ⚠ THE METHOD MUST BE A REQUEST (ruleset 0.1.1). `axios.$M($URL, ...)`
    # with `$M` free matched `axios.create(config)` and `axios.isAxiosError(err)` — constructors and predicates, not
    # requests — found by the gold-set audits. Same family as the JS shell
    # rules' free receiver; tests/fixtures/semgrep/receivers pins both.
    patterns:
      - pattern-either:
          - pattern: fetch($URL, ...)
          - patterns:
              - pattern: axios.$M($URL, ...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(get|post|put|patch|delete|head|options|request|postForm|putForm|patchForm)$
          - pattern: axios($URL, ...)
          - pattern: got($URL, ...)
          - pattern: request($URL, ...)
      - pattern-not: fetch("...", ...)
      - pattern-not: fetch(`...`, ...)
      - pattern-not: axios.$M("...", ...)

  - id: mcp-js-ssrf-metadata-endpoint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A string literal names the cloud instance-metadata endpoint, which serves
      a hosted instance's credentials to anything on it that asks. Code that
      contacts it can be the last step of an SSRF; the same literal is also how
      an SSRF defence names what it blocks, and a pattern cannot tell the two
      apart, so this is listed for review and not deducted.
    metadata:
      mcp_pattern: metadata-endpoint
      cwe: "CWE-918"
    # ⚠ NARROWED IN RULESET 0.1.3. This was a bare pattern-regex, so it matched
    # comments too, deducted as critical, and said the endpoint "is contacted
    # directly". All 29 findings in the published data of 2026-11-03 (7 servers)
    # were SSRF defences, comments explaining them, or tests; none contacted
    # it. Now string literals only, and listed (severity-mapping `listed: true`).
    patterns:
      - pattern-either:
          - pattern: '"$S"'
          - pattern: '`...`'
      - pattern-regex: \b(169\.254\.169\.254|metadata\.google\.internal)\b
