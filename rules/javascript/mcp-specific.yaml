# See rules/python/mcp-specific.yaml for what makes this category distinct: an
# MCP tool argument is a value a language model was persuaded to produce, so
# "the caller is trusted" is not a mitigation.
rules:
  - id: mcp-js-tool-arg-to-shell
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      An MCP tool handler spawns a shell on its own argument. The argument is
      model-supplied and reachable by anything that can influence the model's
      context.
    metadata:
      mcp_pattern: tool-arg-to-shell
      cwe: "CWE-78"
    # ⚠ THE RECEIVER MUST BE child_process (ruleset 0.1.1). This read
    # `$CP.exec($CMD, ...)` with `$CP` unconstrained, so `re.exec(line)` — the
    # ordinary RegExp method — was published as a critical "a shell is spawned"
    # finding: the sibling rule's defect, carried here too, found by the
    # gold-set audits. Two halves, because neither reaches every binding form:
    # semgrep's own import resolution (the qualified patterns) follows a
    # require-bound name and a named import, alias included; the pattern-inside
    # branches catch destructured requires, namespace and default imports, an
    # inline require, and dynamic `import()` — the same binding block as the two
    # rules in shell-exec.yaml, changed with them.
    # tests/fixtures/semgrep/receivers pins both directions.
    patterns:
      - pattern-either:
          - pattern-inside: |
              $SRV.tool($NAME, ..., async ($ARG, ...) => { ... })
          - pattern-inside: |
              $SRV.tool($NAME, ..., ($ARG, ...) => { ... })
          - pattern-inside: |
              $SRV.setRequestHandler(CallToolRequestSchema, async ($ARG, ...) => { ... })
      - pattern-either:
          - pattern: "child_process.exec($CMD, ...)"
          - pattern: "child_process.execSync($CMD, ...)"
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $CP = require("$M");
                      ...
                  - pattern-inside: |
                      import $CP from "$M";
                      ...
                  - pattern-inside: |
                      import * as $CP from "$M";
                      ...
                  - pattern-inside: |
                      $CP = await import("$M");
                      ...
                  - pattern-inside: import("$M").then(($CP) => $BODY)
                  - pattern-inside: import("$M").then(function ($CP) { ... })
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(node:)?child_process$
              - pattern-either:
                  - pattern: "$CP.exec($CMD, ...)"
                  - pattern: "$CP.execSync($CMD, ...)"
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      { ..., $FN, ... } = require("$M");
                      ...
                  - pattern-inside: |
                      import { ..., $FN, ... } from "$M";
                      ...
                  - pattern-inside: |
                      { ..., $FN, ... } = await import("$M");
                      ...
                  - pattern-inside: import("$M").then(({ ..., $FN, ... }) => $BODY)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(node:)?child_process$
              - metavariable-regex:
                  metavariable: $FN
                  regex: ^(exec|execSync)$
              - pattern: "$FN($CMD, ...)"
          - patterns:
              - pattern-either:
                  - pattern: "require(\"$M\").exec($CMD, ...)"
                  - pattern: "require(\"$M\").execSync($CMD, ...)"
                  - pattern: "(await import(\"$M\")).exec($CMD, ...)"
                  - pattern: "(await import(\"$M\")).execSync($CMD, ...)"
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(node:)?child_process$
      - pattern-not: $ANY("...", ...)

  - id: mcp-js-tool-returns-environment
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      An MCP tool returns the process environment, handing every credential the
      server holds to the model.
    metadata:
      mcp_pattern: tool-exfiltrates-secrets
      cwe: "CWE-200"
    patterns:
      - pattern-either:
          - pattern-inside: |
              $SRV.tool($NAME, ..., async ($ARG, ...) => { ... })
          - pattern-inside: |
              $SRV.tool($NAME, ..., ($ARG, ...) => { ... })
      - pattern-either:
          - pattern: return process.env
          - pattern: "return {...process.env}"
          - pattern: "return Object.assign({}, process.env)"
          - pattern: JSON.stringify(process.env)
