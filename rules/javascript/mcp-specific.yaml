# See rules/python/mcp-specific.yaml for what makes this category distinct: an
# MCP tool argument is a value a language model was persuaded to produce, so
# "the caller is trusted" is not a mitigation.
rules:
  - id: mcp-js-tool-arg-to-shell
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      An MCP tool handler spawns a shell on its own argument. The argument is
      model-supplied and reachable by anything that can influence the model's
      context.
    metadata:
      mcp_pattern: tool-arg-to-shell
      cwe: "CWE-78"
    # ⚠ THE RECEIVER MUST BE child_process (ruleset 0.1.1). This read
    # `$CP.exec($CMD, ...)` with `$CP` unconstrained, so `re.exec(line)` — the
    # ordinary RegExp method — was published as a critical "a shell is spawned"
    # finding: the sibling rule's defect, carried here too, found by the
    # gold-set audits. Two halves, because neither reaches every binding form:
    # semgrep's own import resolution (the qualified patterns) follows a
    # require-bound name and a named import, alias included; the pattern-inside
    # branches catch destructured requires, namespace and default imports, an
    # inline require, and dynamic `import()` — the same binding block as the two
    # rules in shell-exec.yaml, changed with them.
    # tests/fixtures/semgrep/receivers pins both directions.
    patterns:
      - pattern-either:
          - pattern-inside: |
              $SRV.tool($NAME, ..., async ($ARG, ...) => { ... })
          - pattern-inside: |
              $SRV.tool($NAME, ..., ($ARG, ...) => { ... })
          - pattern-inside: |
              $SRV.setRequestHandler(CallToolRequestSchema, async ($ARG, ...) => { ... })
      - pattern-either:
          - pattern: "child_process.exec($CMD, ...)"
          - pattern: "child_process.execSync($CMD, ...)"
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $CP = require("$M");
                      ...
                  - pattern-inside: |
                      import $CP from "$M";
                      ...
                  - pattern-inside: |
                      import * as $CP from "$M";
                      ...
                  - pattern-inside: |
                      $CP = await import("$M");
                      ...
                  - pattern-inside: import("$M").then(($CP) => $BODY)
                  - pattern-inside: import("$M").then(function ($CP) { ... })
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(node:)?child_process$
              - pattern-either:
                  - pattern: "$CP.exec($CMD, ...)"
                  - pattern: "$CP.execSync($CMD, ...)"
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      { ..., $FN, ... } = require("$M");
                      ...
                  - pattern-inside: |
                      import { ..., $FN, ... } from "$M";
                      ...
                  - pattern-inside: |
                      { ..., $FN, ... } = await import("$M");
                      ...
                  - pattern-inside: import("$M").then(({ ..., $FN, ... }) => $BODY)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(node:)?child_process$
              - metavariable-regex:
                  metavariable: $FN
                  regex: ^(exec|execSync)$
              - pattern: "$FN($CMD, ...)"
          - patterns:
              - pattern-either:
                  - pattern: "require(\"$M\").exec($CMD, ...)"
                  - pattern: "require(\"$M\").execSync($CMD, ...)"
                  - pattern: "(await import(\"$M\")).exec($CMD, ...)"
                  - pattern: "(await import(\"$M\")).execSync($CMD, ...)"
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(node:)?child_process$
      - pattern-not: $ANY("...", ...)

  - id: mcp-js-tool-returns-environment
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      An MCP tool returns the process environment, handing every credential the
      server holds to the model.
    metadata:
      mcp_pattern: tool-exfiltrates-secrets
      cwe: "CWE-200"
    patterns:
      - pattern-either:
          - pattern-inside: |
              $SRV.tool($NAME, ..., async ($ARG, ...) => { ... })
          - pattern-inside: |
              $SRV.tool($NAME, ..., ($ARG, ...) => { ... })
      - pattern-either:
          - pattern: return process.env
          - pattern: "return {...process.env}"
          - pattern: "return Object.assign({}, process.env)"
          - pattern: JSON.stringify(process.env)

  # ⚠ THE MARKER REGEX IS SHARED — identical in the python, javascript and go
  # copies of this rule (tests/test_ruleset.py holds them equal). Semgrep's
  # metavariable-regex is anchored at the start of the matched text, hence the
  # leading `^.*?`. Listed, not deducted (severity-mapping `listed: true`): its
  # precision is unmeasured, and a security tool that quotes the phrases it
  # detects matches too — a quoted override phrase is excluded, the rest is
  # left for the reader. Ruleset 0.1.3.
  - id: mcp-js-tool-description-injection
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A tool or parameter description contains text shaped like an instruction to the model rather than a description for it (a hidden-instruction tag, a request to keep something from the user, an override of earlier instructions, a step required before using a tool, or an invisible character). A client places tool descriptions in the model's context as trusted text, so wording like this is how a tool-poisoning attack is carried; it can also be a description that quotes such wording. Review the text in the excerpt.
    metadata:
      mcp_pattern: tool-description-injection
      cwe: "CWE-1427"
    patterns:
      - pattern-either:
          - pattern: |
              {..., description: $D, ...}
          - pattern: |
              $S.tool($NAME, $D, ...)
          - pattern: |
              $X.describe($D)
      - metavariable-regex:
          metavariable: $D
          regex: '(?is)^.*?(<\s*/?\s*(important|system|instructions?|secret|hidden)\s*>|\b(do\s+not|don''t|never)\s+(tell|inform|notify|alert)\s+(the\s+)?(user|human)\b(?![^.\n]{0,80}\b(until|unless)\b)|\b(do\s+not|don''t|never)\s+(mention|reveal|disclose|show)\s+((this|it|that|these|any\s+of\s+this)\s+)?to\s+(the\s+)?(user|human)\b(?![^.\n]{0,80}\b(until|unless)\b)|(?<![''\"\x{2018}\x{201C}])\b(ignore|disregard|forget)\s+(all\s+|any\s+)?(previous|prior|above|earlier|other)\s+(instructions|prompts|rules|directions)|\b(before|prior\s+to)\s+(using|calling|invoking|running)\s+(this|any\s+other|other)\s+tools?\b[^.\n]{0,40}\b(you\s+must|must|always|first)\b|[\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2066}-\x{2069}\x{E0000}-\x{E007F}]|\\u(200[b-f]|202[a-e]|206[6-9])|\\U000e00[0-7][0-9a-f]|\\u\{e00[0-7][0-9a-f]\})'
      # Report the DESCRIPTION, not the call around it: the excerpt must show
      # the words that matched, or the page cannot show the reader why.
      - focus-metavariable: $D
