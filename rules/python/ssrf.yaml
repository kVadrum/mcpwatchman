rules:
  - id: mcp-python-ssrf-nonliteral-url
    languages: [python]
    severity: WARNING
    message: >-
      An outbound HTTP request is made to a URL that is not a literal. If any
      part of it is caller-supplied, the server can be steered at internal
      hosts — cloud metadata endpoints, admin ports, other tenants.
    metadata:
      mcp_pattern: value-to-fetch
      cwe: "CWE-918"
    # ⚠ THE METHOD MUST BE A REQUEST (ruleset 0.1.1). `httpx.$M($URL, ...)`
    # with `$M` free matched `httpx.BasicAuth(user, pw)` and `httpx.Timeout(t)` — constructors and predicates, not
    # requests — found by the gold-set audits. Same family as the JS shell
    # rules' free receiver; tests/fixtures/semgrep/receivers pins both.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: requests.$M($URL, ...)
                  - pattern: httpx.$M($URL, ...)
                  - pattern: aiohttp.ClientSession(...).$M($URL, ...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(get|post|put|patch|delete|head|options|request|stream)$
          - pattern: urllib.request.urlopen($URL, ...)
      - pattern-not: $LIB.$M("...", ...)
      - pattern-not: urllib.request.urlopen("...", ...)

  - id: mcp-python-ssrf-metadata-endpoint
    languages: [python]
    severity: WARNING
    message: >-
      A string literal names the cloud instance-metadata endpoint, which serves
      a hosted instance's credentials to anything on it that asks. Code that
      contacts it can be the last step of an SSRF; the same literal is also how
      an SSRF defence names what it blocks, and a pattern cannot tell the two
      apart, so this is listed for review and not deducted.
    metadata:
      mcp_pattern: metadata-endpoint
      cwe: "CWE-918"
    # ⚠ NARROWED IN RULESET 0.1.3. This was a bare pattern-regex, so it matched
    # comments too, deducted as critical, and said the endpoint "is contacted
    # directly". All 29 findings in the published data of 2026-11-03 (7 servers)
    # were SSRF defences, comments explaining them, or tests; none contacted
    # it. Now string literals only, and listed (severity-mapping `listed: true`).
    patterns:
      - pattern: '"$S"'
      - metavariable-regex:
          metavariable: $S
          regex: (?s)^.*?\b(169\.254\.169\.254|metadata\.google\.internal|metadata\.azure\.com)\b
