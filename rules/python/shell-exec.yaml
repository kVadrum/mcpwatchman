# Shell execution reachable from a caller-supplied value.
#
# Severity and confidence are NOT here — `_meta/severity-mapping.yaml` is the
# canonical map (`04` §4.1) and the `severity:` below is semgrep's own
# schema-required field, kept as a mechanical projection of ours so the two
# cannot disagree in meaning (asserted in tests/test_ruleset.py).
rules:
  - id: mcp-python-shell-true-nonliteral
    languages: [python]
    severity: ERROR
    message: >-
      A subprocess is spawned with shell=True on a value that is not a string
      literal. Any caller-supplied component of that value is shell-injectable:
      `; rm -rf ~` in an argument is executed, not passed.
    metadata:
      mcp_pattern: value-to-shell
      cwe: "CWE-78"
      references:
        - https://docs.python.org/3/library/subprocess.html#security-considerations
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ..., shell=True, ...)
          - pattern: subprocess.call($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_call($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
          - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
      - pattern-not: subprocess.$F("...", ..., shell=True, ...)

  - id: mcp-python-os-system-interpolated
    languages: [python]
    severity: ERROR
    message: >-
      os.system() is called on an interpolated string. os.system has no
      argument-vector form at all, so every interpolated value is shell syntax.
    metadata:
      mcp_pattern: value-to-shell
      cwe: "CWE-78"
    pattern-either:
      - pattern: os.system(f"...")
      - pattern: os.system("..." % ...)
      - pattern: os.system("...".format(...))
      - pattern: os.system("..." + $X)
      - pattern: os.popen(f"...")
