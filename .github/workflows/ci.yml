name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

# A lint job reads the checkout and writes nothing; the default grant is wider.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Via the dev extra so CI and a local `ruff check` share one pinned
      # version — a floating ruff reds CI the day a release adds a rule.
      - run: pip install -e ".[dev]"
      - run: ruff check .

# A test job is added once there are tests to run (workspace policy: no empty
# test CI). Publishing lives in release.yml, fired by a vX.Y.Z tag.
