name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

# A test job is added once there are tests to run (workspace policy: no empty
# test CI). Trusted-publishing release.yml lands when the package first ships.
