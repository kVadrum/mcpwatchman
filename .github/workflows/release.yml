name: release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Split deliberately: `pip install` executes arbitrary code from transitive
# dependencies, so it must not run in a job that can mint a publish credential.
# The build job holds no id-token; the publish job installs nothing.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history and branches, for the ancestry check below.
          fetch-depth: 0
      # Any `v*.*.*` tag on ANY commit fires this workflow, and the version
      # guard further down proves only that the numbers agree. `main` is the
      # branch a human syncs after review; a tag on a feature branch, on a
      # commit `dev` later dropped, or on one that never ran CI must not reach
      # PyPI. Here, in the job with no publish credential, so `publish` (which
      # needs this job) never starts.
      - name: The tagged commit is on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::tag $GITHUB_REF_NAME is at $GITHUB_SHA, which is not on main"
            exit 1
          }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # The whole toolchain from a hash-locked file, and the build NOT isolated:
      # an isolated build resolves `hatchling` fresh from PyPI inside this job,
      # so an unpinned build backend would write the wheel PyPI receives.
      - run: pip install --require-hashes -r requirements/build.txt
      - run: python -m build --no-isolation
      # Malformed metadata is rejected at upload — and a rejected upload still
      # burns the version number, which PyPI never lets you reuse.
      - run: twine check dist/*
      # The tag is the only value a human types; everything else is derived from
      # the tree. Three files must already agree (bump-audit checks one of them),
      # and __version__ is what `mcpwatchman --version` reports, so a half-bump
      # would ship a CLI that lies about itself — permanently, at this registry.
      - name: Tag, artifact and source versions agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          built=$(python -c "import glob,os; print(os.path.basename(glob.glob('dist/*.whl')[0]).split('-')[1])")
          proj=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/mcpwatchman/__init__.py').read()).group(1))")
          echo "tag=$tag wheel=$built pyproject=$proj __version__=$init"
          for v in "$built" "$proj" "$init"; do
            [ "$v" = "$tag" ] || { echo "::error::version mismatch — tag $tag vs $v"; exit 1; }
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    # Actions are pinned to commit SHAs, not tags: a tag is mutable, and any
    # code running in this job can request the PyPI credential. Dependabot
    # keeps the pins current (.github/dependabot.yml) so they cannot go stale.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          # Explicit: the action's canonical `packages-dir` declares no default,
          # and `dist` reaches it only via the deprecated `packages_dir` alias
          # that upstream has marked for removal in v3+.
          packages-dir: dist/
