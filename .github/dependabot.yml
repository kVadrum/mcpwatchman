version: 2
updates:
  # Release actions are SHA-pinned, which is only safe with something moving
  # the pins — an unmaintained pin is a stale dependency that looks deliberate.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  # The hash-locked Python sets (requirements/*.txt, generated by uv from
  # pyproject.toml and requirements/build.in) and the site's npm lockfile.
  # A two-week cooldown: a release is adopted once it has been public long
  # enough for a compromised one to be caught and pulled. Security updates
  # are not version updates and do not wait (they need alerts enabled).
  - package-ecosystem: pip
    directories: ["/", "/requirements"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
