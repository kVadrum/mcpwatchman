version: 2
updates:
  # Every entry targets `dev`. The default branch is `main`, and a Dependabot PR
  # merged there puts main ahead of dev. Dependabot reads this file from `main`,
  # so a change here takes effect at the next sync; security updates ignore
  # target-branch and always open against the default branch.
  #
  # Release actions are SHA-pinned, which is only safe with something moving
  # the pins — an unmaintained pin is a stale dependency that looks deliberate.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
  # No pip entry, deliberately. The hash-locked Python sets (requirements/*.txt)
  # are `uv pip compile` output whose line-2 command carries an `--exclude-newer`
  # cutoff set two weeks back — the cutoff is their cool-off — and CI's `locks`
  # job re-runs that command and diffs. Dependabot rewrites a pin but cannot move
  # the cutoff, so all ten pip PRs it opened on 2026-10-22 were red by
  # construction; eight also pinned past a constraint they never resolved
  # (pydantic-core past pydantic's exact pin, protobuf 7 past opentelemetry-proto's
  # <7, exceptiongroup and peewee past semgrep's ~=). A lock moves by moving the
  # cutoff in every file and re-running each line-2 command WITH --upgrade:
  # without it uv prefers the pins already in the output file, so a moved cutoff
  # alone changes nothing but the header. uv leaves --upgrade out of the header,
  # so line 2 stays the command the locks job runs.
  #
  # The site's npm lockfile, with a two-week cooldown: a release is adopted once
  # it has been public long enough for a compromised one to be caught and pulled.
  - package-ecosystem: npm
    directory: "/site"
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
