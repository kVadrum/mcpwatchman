version: 2
updates:
  # Every entry targets `dev`. The default branch is `main`, and a Dependabot PR
  # merged there puts main ahead of dev. Dependabot reads this file from `main`,
  # so a change here takes effect at the next sync; security updates ignore
  # target-branch and always open against the default branch.
  #
  # Release actions are SHA-pinned, which is only safe with something moving
  # the pins — an unmaintained pin is a stale dependency that looks deliberate.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
  # No pip entry, deliberately — do not add one back. The hash-locked Python
  # sets (requirements/*.txt) are `uv pip compile` output whose line-2 command
  # carries an `--exclude-newer` cutoff two weeks back (their cool-off), and CI's
  # `locks` job re-runs that command and diffs. Dependabot rewrites a pin without
  # moving the cutoff or resolving the graph, so every pip PR it opens is red by
  # construction (24b84e2 records the batch that proved it). A lock moves by
  # moving the cutoff in every file and re-running each line-2 command WITH
  # --upgrade — without it uv keeps the pins already in the output file — and uv
  # leaves --upgrade out of the header, so line 2 stays the locks job's command.
  #
  # The site's npm lockfile, with a two-week cooldown: a release is adopted once
  # it has been public long enough for a compromised one to be caught and pulled.
  - package-ecosystem: npm
    directory: "/site"
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
